<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaFit | Administrador</title>
    <link rel="icon" type="image/png" href="Assets/img/VidaFit_Logo_head-removebg-preview.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Assets/Css/stylesAdministrador.css">

    <!-- Verificación inicio de sesion-->
    <script>
        const userRole = localStorage.getItem('userRole');
            if (userRole !== 'ADMIN') {
                alert('Sesión no válida o expirada. Por favor ingresa como Administrador.');
                window.location.href = 'Login.html';
        }
    </script>
</head>

<body class="bg-light text-dark">

    <div class="d-flex min-vh-100">
        <!-- Sidebar Navigation -->
        <aside class="bg-dark text-white p-3 d-flex flex-column justify-content-between style-sidebar" style="width: 280px; min-height: 100vh;">
            <div>
                <!-- Brand / User Info -->
                <div class="d-flex align-items-center gap-3 pb-3 mb-3 border-bottom border-secondary">
                    <i class="bi bi-person-circle fs-2 text-primary"></i>
                    <div>
                        <h6 class="mb-0 fw-bold">Panel Admin</h6>
                        <small class="text-white-50" id="lblUsuarioRol">Administrador</small>
                    </div>
                </div>

                <!-- Navigation Links -->
                <ul class="nav nav-pills flex-column mb-auto gap-2">
                    <li class="nav-item">
                        <a href="adminIndex.html" class="nav-link text-white-50" aria-current="page">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboardAdmin.html" class="nav-link text-white-50">
                            <i class="bi bi-box-seam me-2"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="pedidosAdmin.html" class="nav-link active text-white">
                            <i class="bi bi-clipboard2 me-2"></i>
                            Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="usuariosRegistrados.html" class="nav-link text-white-50">
                            <i class="bi bi-people me-2"></i> Usuarios
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Logout Section -->
            <div class="pt-3 border-top border-secondary">
                <button type="button" class="btn btn-outline-danger w-100 text-start" id="btnCerrarSesionAdmin">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                </button>
            </div>
        </aside>

                <!-- Main Content Area -->
        <main class="flex-grow-1 p-4">
            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="h3 fw-bold mb-0">Pedidos</h1>
                    <p class="text-muted mb-0">Bienvenido al panel de control de los Pedidos del ecommerce de VidaFit</p>
                </div>
                <a href="index.html" class="btn btn-outline-secondary btn-sm" >
                    <i class="bi bi-shop me-1"></i> Ver Tienda
                </a>
    </header>

    <main class="container pb-5" >
        <section  class="card bg-white mb-5" id="padreFormulario">
            <div class="card-body p-4 p-lg-5">

                <section class="vf-panel">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>Pedidos recibidos</h2>
                        <button class="btn btn-outline-primary" id="btnActualizarPedidos">
                            <i class="bi bi-arrow-clockwise me-1"></i>
                            Actualizar
                        </button>
                    </div>

                    <div id="mensajePedidos" class="alert d-none" role="alert"></div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col"># Orden</th>
                                    <th scope="col">Cliente</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col">Total de productos</th>
                                    <th scope="col">Total del pedido</th>
                                    <th scope="col">Fecha</th>
                                </tr>
                            </thead>

                            <tbody id="tablaPedidos">
                                <tr>
                                    <td colspan="5" class="text-center py-4">
                                        Cargando pedidos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

        </section>

    </main>

    </main>

    <script src="Assets/Js/pedidosRecibidos.js"></script>
</body>
