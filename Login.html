<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaFit - Iniciar Sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fuentes Oficiales de VidaFit: Russo One + Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    
    <!-- Estilos Flat UI de Autenticación -->
    <link rel="stylesheet" href="Assets/Css/auth-flat.css">
</head>
<body class="flat-body">

    <!--navegación de regreso -->
    <header class="w-100 py-3 px-4 bg-white border-bottom position-absolute top-0 start-0">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="d-flex align-items-center text-decoration-none">
                <img src="Assets/img/VidaFit logo 1.png" alt="Logo VidaFit" height="40">
            </a>
            <a href="index.html" class="btn btn-flat-outline">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
        </div>
    </header>

    <!-- Tarjeta Principal de Login -->
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="flat-card text-center p-4 p-sm-5 mt-5">
            
            <!-- Badge Icono -->
            <div class="flat-avatar mx-auto mb-3">
                <i class="bi bi-person-fill"></i>
            </div>

            <!-- Encabezados con Russo One-->
            <span class="flat-badge-title mb-1">ACCESO A TU CUENTA</span>
            <h2 class="flat-title mb-1">¡Bienvenido a VidaFit!</h2>
            <p class="flat-subtitle mb-4">Ingresa tus datos para continuar tus compras</p>

            <form id="loginForm">
                <!-- Correo Electrónico -->
                <div class="mb-3 text-start">
                    <label for="email" class="flat-label">Correo Electrónico</label>
                    <div class="flat-input-group">
                        <i class="bi bi-envelope flat-input-icon"></i>
                        <input type="email" id="email" class="flat-input" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3 text-start">
                    <label for="password" class="flat-label">Contraseña</label>
                    <div class="flat-input-group">
                        <i class="bi bi-lock flat-input-icon"></i>
                        <input type="password" id="password" class="flat-input" placeholder="••••••••" required>
                    </div>
                </div>

                <!--Recordarme / Olvidó clave -->
                <div class="d-flex justify-content-between align-items-center mb-4 flat-sm-text">
                    <label class="d-flex align-items-center gap-2 cursor-pointer text-secondary">
                        <input type="checkbox" class="flat-checkbox">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="flat-link">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- CTA con Russo One -->
                <button type="submit" class="btn btn-flat-primary w-100 mb-4">
                    INICIAR SESIÓN <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
            </form>

            <!-- Divisor -->
            <div class="flat-divider mb-4">
                <span>O CONTINÚA CON</span>
            </div>

            <!-- Redes -->
            <div class="d-flex justify-content-center gap-3 mb-4">
                <a href="#" class="btn btn-flat-social"><i class="bi bi-google"></i> Google</a>
                <a href="#" class="btn btn-flat-social"><i class="bi bi-facebook"></i> Facebook</a>
            </div>

            <!-- Enlace a Registro -->
            <p class="flat-sm-text mb-0">
                ¿Aún no tienes una cuenta? <a href="registro.html" class="flat-link-bold">Regístrate gratis</a>
            </p>

        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Assets/Js/login-admin.js"></script>
</body>
</html>
