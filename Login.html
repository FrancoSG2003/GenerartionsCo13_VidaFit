<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaFit - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Assets/Css/registro.css">
</head>

<body>

    <div class="main-wrapper" id="padre">
        <div class="row h-100 g-0">

            <div class="col-lg-5 d-flex flex-column justify-content-between p-4 image-panel text-white imagen-registro">
                <div class="mt-auto w-100 text-center text-lg-start mb-2">
                    <h2 class="fw-medium lh-base mb-2" style="max-width: 280px;">Fuerza, Energía y Vitalidad</h2>
                </div>
            </div>

            <div class="col-lg-7 d-flex align-items-center justify-content-center px-3 py-4">
                <div class="w-100" style="max-width: 460px;">

                    <h1 class="fw-semibold text-white mb-1 py-2">Iniciar Sesión</h1>
                    <p class="text-secondary small mb-4">
                        ¿Aún no tienes una cuenta? <a href="registro.html">Regístrate</a>
                    </p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <input type="email" id="email" class="form-control form-control-lg fs-6"
                                placeholder="Email (nombre de usuario)" required>
                        </div>

                        <div class="mb-3 position-relative">
                            <input type="password" id="password" class="form-control form-control-lg fs-6 pe-5"
                                placeholder="Contraseña" required>
                            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-secondary"
                                id="verContraseña" style="cursor: pointer;"></i>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label small text-secondary" for="remember">
                                    Recordarme
                                </label>
                            </div>
                            <a href="#" class="small text-secondary text-decoration-none">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" id="btnLogin" class="btn btn-principal btn-lg w-100 fs-6 fw-medium mb-4">
                            Iniciar sesión
                        </button>

                        <div class="flat-divider mb-4 text-white">
                            <h5>O ingresa con:</h5>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <a href="#" class="btn btn-flat-social text-white"><i class="bi bi-google"></i> Google</a>
                            <a href="#" class="btn btn-flat-social text-white"><i class="bi bi-facebook"></i> Facebook</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="Assets/Js/login.js"></script>
    <script src="Assets/Js/login-admin.js"></script>
</body>

</html>
