<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Assets/Css/Admin.css">
    <title>Dashboard</title>
</head>
<body>

    <div class="dashboard">

        <aside class="sideBar">
            <div class="headerBar">
                <div class="admin-icon">
                    <i class="bi bi-person-lock"></i>
                </div>
                <h3>Admin</h3>
            </div>

            <nav class="menu">
                <a href="dashboardAdmin.html">
                    <i class="bi bi-box"></i>
                    Productos
                </a>
                <nav class="menu">
                <a href="#">
                    <i class="bi bi-tags"></i>
                    Categoria
                </a>
                <nav class="menu">
                <a href="#">
                    <i class="bi bi-cart"></i>
                    Pedidos
                </a>
                <nav class="menu">
                <a href="#">
                    <i class="bi bi-person-badge"></i>
                    Usuarios
                </a>
                <nav class="menu">
                <a href="#">
                    <i class="bi bi-people"></i>
                    Clientes
                </a>
            </nav>

            <a href="index.html" class="cerrar-sesion">
                <i class="bi bi-door-closed-fill icono-cerrado"></i>
                <i class="bi bi-door-open-fill icono-abierto"></i>
                <span>Cerrar sesion</span>
            </a>
        </aside>

        <main class="contenido">
            <header>
                <h1>Panel Administrativo</h1>

                <div class="contadorVisitas">
                    <h5>Vistas Mensuales</h5>
                    <span>0</span>
                </div>
            </header>

            <div class="estadisticas">
                <div class="card-estadistica">
                    <span>Ventas Hoy:</span>
                    <strong>0</strong>
                </div>

                <div class="card-estadistica">
                    <span>Ventas Semana:</span>
                    <strong>0</strong>
                </div>

                <div class="card-estadistica">
                    <span>Ventas Mes:</span>
                    <strong>0</strong>
                </div>
            </div>

            <section class="historial-ventas">
                <h2>Historial de ventas</h2>
            </section>
        </main>
    </div>
        



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
