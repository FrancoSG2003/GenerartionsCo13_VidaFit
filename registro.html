<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Boostraps icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Assets/Css/">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3 p-md-4">

    <div class="main-wrapper p-3">
        <div class="row g-4">

            <!-- Panel izquierdo-->
            <div class="col-lg-5 d-flex flex-column justify-content-between p-4 image-panel text-white">
                <div class="d-flex align-items-start w-100">
                    <img src="tu-logo.png" alt="Logo AMU" style="height: 32px; filter: brightness(0) invert(1);">
                </div>

                <!-- Texto informativo en la parte inferior -->
                <div class="mt-auto w-100 text-center text-lg-start mb-2">
                    <h2 class="fw-medium lh-base mb-2" style="max-width: 280px;">Capturing Moments, Creating Memories</h2>
                </div>
            </div>

            <!-- COLUMNA DERECHA: FORMULARIO -->
            <div class="col-lg-7 d-flex align-items-center justify-content-center px-3 px-sm-5 py-4">
                <div class="w-100" style="max-width: 460px;">
                    
                    <!-- Encabezado -->
                    <h1 class="fw-semibold mb-1">Registro</h1>
                    <p class="text-secondary small mb-4">
                        Ya tienes una cuenta? <a href="#">Log in</a>
                    </p>

                    <form>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <input type="text" class="form-control form-control-lg fs-6" placeholder="Nombre" required>
                            </div>
                            <div class="col-sm-6">
                                <input type="text" class="form-control form-control-lg fs-6" placeholder="Apellido" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control form-control-lg fs-6" placeholder="Email" required>
                        </div>
                        <div class="mb-3 position-relative">
                            <input type="password" id="Inputcontraseña" class="form-control form-control-lg fs-6 pe-5" placeholder="Contraseña" required>
                            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-secondary" id="verContraseña" style="cursor: pointer;"></i>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" checked required>
                            <label class="form-check-label small text-secondary" for="terms">
                                He leido y acepto los <a href="#">Terminos y condiciones</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-purple btn-lg w-100 fs-6 fw-medium mb-4">Crear cuenta</button>

                        <div class="divider mb-4"><h5>Regiatro con: </h5></div>

                        <!-- Botones Sociales -->
                        <div class="row g-3">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2 small">
                                    <i class="bi bi-google"></i>
                                    Google
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>            

    <!--Boostrap Js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
